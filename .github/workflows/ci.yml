name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Run every Node version to completion instead of cancelling siblings
      # the moment one fails — a single flaky/version-specific failure
      # shouldn't hide results from the others.
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Test
        if: matrix.node-version != 22
        run: npm test

      - name: Test with coverage gate (>=90%)
        if: matrix.node-version == 22
        run: npm run test:coverage:check

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # Release-readiness checks run on every PR so breakage is caught early.
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm run test:package

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Pack dry run
        run: npm run pack:dry-run
